name: psalm

# The dev dependency guzzlehttp/psr7 ^1.6 is affected by a security advisory, so
# composer >= 2.9 refuses to install it and the whole matrix fails on install.
env:
  COMPOSER_NO_SECURITY_BLOCKING: 1

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  psalm:
    name: psalm
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      matrix:
        experimental: [ false ]
        php-version:
          - "7.4"
          - "8.0"
          - "8.1"
        dependencies:
          - highest
        include:
          - php-version: "7.1"
            dependencies: lowest
            experimental: true
          - php-version: "8.0"
            dependencies: lowest
            experimental: true

    steps:
      - name: Checkout.
        uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Validate Composer
        run: composer validate

      - name: Install dependencies with Composer
        uses: ramsey/composer-install@v1
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Static Analysis
        run: |
          vendor/bin/psalm --php-version=${{ matrix.php-version }}
